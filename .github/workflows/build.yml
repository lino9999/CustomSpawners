name: Build and compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            api: 1.21.11-R0.1-SNAPSHOT
          - java: '25'
            api: 26.1.2.build.74-stable
          - java: '25'
            api: 26.2.build.134-stable
          - java: '25'
            api: 26.3.build.218-stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode verify -Dpaper.version=${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: matrix.java == '21'
        with:
          name: CustomSpawners
          path: target/CustomSpawners-*.jar
